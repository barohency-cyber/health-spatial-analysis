name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run CLI without map
        run: python code/two_step_fca.py --no-map --output-dir output/ci

      - name: Run LISA without map
        run: python code/spatial_autocorr.py --permutations 199 --no-map --output-dir output/ci

      - name: Generate interactive map
        run: python code/make_web_map.py --output docs/index.html
